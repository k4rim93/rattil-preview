name: Publish isolated Rattil preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: preview-pages
  cancel-in-progress: true
jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved prototype
        uses: actions/checkout@v6
        with:
          repository: k4rim93/rattil-app
          ref: 27becd3454c1f07bc5e2dac041d25f2b1395e5c2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
